# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - app-calculadora-B

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publicar Backend en carpeta fija
        run: dotnet publish ScientificCalculator.Backend/ScientificCalculator.Backend.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Subir artefacto directo
        uses: actions/upload-artifact@v4
        with:
          name: net-backend-app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Descargar artefacto directo
        uses: actions/download-artifact@v4
        with:
          name: net-backend-app
          path: ${{ github.workspace }}/to-deploy
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-calculadora-B'
          slot-name: 'Production'
          package: ${{ github.workspace }}/to-deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B08F355F99FB4DF8B5B509B1FDD79C98 }}
